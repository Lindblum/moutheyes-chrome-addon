<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Video Moutheyes</h1>
      <button id="toggle" title="Turn moutheyes on or off for this video">Off</button>
    </header>
    <p id="status" class="status">Checking tab…</p>

    <label title="Size of each mouth relative to the eye it covers.">Mouth size <output for="mouthScale"></output>
      <input id="mouthScale" type="range" min="0.8" max="2.5" step="0.05" />
    </label>

    <label title="How many faces per video get moutheyes. More faces cost a little more GPU time.">Faces
      <select id="maxFaces">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>
    </label>

    <label title="Steadies the mouths when a face is still. Higher is steadier but trails a little behind quick movement.">Smoothing <output for="smoothing"></output>
      <input id="smoothing" type="range" min="0" max="0.95" step="0.05" />
    </label>

    <label class="check" title="Feathers the mouths only into skin and matches their tone to the skin around each eye.">
      <input id="skinMatch" type="checkbox" /> Blend into skin
    </label>
    <label class="check"><input id="showStats" type="checkbox" /> Show stats overlay</label>

    <footer>
      <kbd>Alt+Shift+E</kbd> toggles moutheyes on the video under the mouse
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
